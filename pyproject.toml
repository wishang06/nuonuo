[project]
name = "nuonuo"
version = "0.1.0"
description = "Nuonuo - an energetic anime AI desktop companion"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "websockets>=13.0",
    "python-dotenv>=1.0",
    "pygame>=2.5",
]

[project.scripts]
nuonuo = "nuonuo.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nuonuo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
